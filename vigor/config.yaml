defaults:
    - override hydra/launcher: submitit_local
    - override hydra/job_logging: disabled
    - override hydra/hydra_logging: disabled

name: TDMPC2 # algorithm: TDMPC2 (baseline) or VIGOR
exp_type: ???
dataset_dir: /path/to/dataset
# environment
domain: dmc
task: walker-walk
image_size: 64
episodic: false
action_repeat: 2
frame_stack: 3

# evaluation
checkpoint: ???
eval_episodes: 10
eval_freq: 10000

# training
steps: 1_000_000
batch_size: 256
device: cuda:0
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
alpha: 1.0
zeta: 1.0
places_num_workers: 8   # dataloader workers for reading Places images
places_num_bg: 2048     # Places images cached on the GPU, pre-resized to image_size; 0 streams the full dataset with random crops
places_seed: 0          # seed for choosing the cached Places images
buffer_size: 1_000_000
exp_name: default

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: vigor
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: true
save_video: true
save_agent: true
seed: 1 

# convenience
work_dir: ???
task_title: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???

hydra:
    output_subdir: null
    run:
        dir: .
