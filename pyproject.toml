[project]
name = "vigor"
version = "1.0.0"
description = "VIGOR: Zero-Shot Visual Generalization via Latent-Space Consistency in Model-Based Reinforcement Learning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "mngupark" }]
requires-python = "==3.9.*"
dependencies = [
    "torch==2.5.0",
    "torchvision==0.20.0",
    "tensordict==0.6.2",
    "torchrl==0.6.0",
    "numpy==1.24.4",
    "dm-control==1.0.16",
    "mujoco==3.1.2",
    "robosuite==1.4.0",
    "gymnasium==0.29.1",
    "glfw==2.7.0",
    "hydra-core==1.3.2",
    "hydra-submitit-launcher==1.2.0",
    "submitit==1.5.1",
    "omegaconf==2.3.0",
    "imageio==2.34.1",
    "imageio-ffmpeg==0.4.9",
    "moviepy==1.0.3",
    "opencv-python==4.10.0.84",
    "h5py==3.11.0",
    "kornia==0.7.2",
    "pandas==2.0.3",
    "termcolor==2.4.0",
    "tqdm==4.66.4",
    "wandb==0.26.1",
    "xmltodict==0.14.2",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vigor*"]

[tool.setuptools.package-data]
vigor = ["config.yaml", "envs/cfgs/*.yaml", "envs/data/**/*"]

[tool.uv]
# Training requires CUDA + EGL rendering, so only Linux x86_64 is resolved and locked.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
